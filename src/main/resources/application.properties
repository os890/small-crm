quarkus.application.name=small-crm
quarkus.http.port=8080

# --- Persistence: file based H2 -------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:file:${smallcrm.data-dir:./data}/smallcrm;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
# Flyway owns the schema; Hibernate only checks that it still matches the entities and never
# alters anything itself.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Installations created before Flyway was introduced already carry the V1 schema, built by
# Hibernate. Baselining adopts them at version 1 instead of trying to create the tables again.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=Schema created by Hibernate before Flyway was introduced
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# --- Security: form based login against the app_user table ----------------------
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.post-location=/api/auth/login
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
# Empty page settings make the form mechanism answer with status codes instead of
# redirects, which is what a single page application needs.
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.timeout=PT8H
quarkus.http.auth.form.new-cookie-interval=PT30M
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.session.encryption-key=${SMALLCRM_SESSION_KEY:change-me-in-production-at-least-16-chars-long}

quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/logout,/q/health,/q/health/*,/q/openapi,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# --- First start bootstrap ------------------------------------------------------
# The very first start creates this administrator. The account is flagged so that
# the password must be changed before anything else can be done.
smallcrm.bootstrap.admin.username=admin
smallcrm.bootstrap.admin.password=changeit

# --- Angular frontend (served by Quinoa) ----------------------------------------
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/small-crm/browser
quarkus.quinoa.package-manager=pnpm
# Lifecycle scripts stay off during dependency installation; nothing in this frontend needs
# them, and it removes a supply chain attack surface from the build.
quarkus.quinoa.package-manager-command.install=install --ignore-scripts
quarkus.quinoa.package-manager-command.ci=install --frozen-lockfile --ignore-scripts
# "build:ci" verifies Prettier formatting before it produces the bundle.
quarkus.quinoa.package-manager-command.build=run build:ci
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.dev-server.managed=true
quarkus.quinoa.dev-server.index-page=index.html

# --- Backups --------------------------------------------------------------------
# A folder beside the database holding one XML file per change, plus whatever an
# administrator creates by hand. How long they are kept is set in the interface and
# stored in the database; everything here is an operator setting.
smallcrm.backup-dir=${SMALLCRM_BACKUP_DIR:./backup}
smallcrm.backup.auto-enabled=true
# Changes arriving within this many seconds of each other end up in one file, so a burst
# of edits does not fill the folder with near identical copies.
smallcrm.backup.coalesce-seconds=30

# Uploaded backups are read into memory, so the limit has to clear the largest file the
# service itself accepts.
quarkus.http.limits.max-body-size=64M

# --- Localisation ---------------------------------------------------------------
# Bean validation messages follow the browser's Accept-Language header, so a user who
# switched the UI to German also gets German field errors. English is the fallback and
# must not depend on the locale of the machine the server happens to run on.
quarkus.default-locale=en
quarkus.locales=en,de

# --- Misc -----------------------------------------------------------------------
quarkus.http.enable-compression=true
quarkus.smallrye-openapi.info-title=Small CRM API
quarkus.smallrye-openapi.info-version=0.1.0

# --- Development ----------------------------------------------------------------
%dev.quarkus.log.category."org.smallcrm".level=DEBUG
%dev.quarkus.http.auth.form.cookie-same-site=lax

# --- Tests: isolated in memory database, no Angular build -----------------------
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:smallcrm-test;DB_CLOSE_DELAY=-1
# The tests run the real migrations against an empty in-memory database, so a broken or
# outdated script fails the build rather than surfacing on someone's installation.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.quinoa.enabled=false
%test.smallcrm.bootstrap.admin.username=admin
%test.smallcrm.bootstrap.admin.password=changeit
# Append to the execution data the Maven agent already collects for the plain unit tests,
# and leave report generation and threshold checking to the JaCoCo Maven plugin.
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
# Tests drive the backup writer explicitly; a background timer would make them flaky.
%test.smallcrm.backup.auto-enabled=false
%test.smallcrm.backup.coalesce-seconds=1
