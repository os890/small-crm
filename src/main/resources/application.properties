quarkus.application.name=small-crm
quarkus.http.port=8080

# --- Persistence: file based H2 -------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
# Empty by default because the database is a local file only this process opens. An
# operator who wants belt and braces can set SMALLCRM_DB_PASSWORD.
quarkus.datasource.password=${SMALLCRM_DB_PASSWORD:}
# AUTO_SERVER is deliberately absent. It opens an H2 TCP listener on a random port bound
# to the machine's LAN address, reachable by any host that finds it, guarded only by user
# "sa"; and H2 allows CREATE ALIAS ... FOR "java.lang.Runtime", so reaching that port is
# code execution. This is a single process application: nothing needs a second JVM.
quarkus.datasource.jdbc.url=jdbc:h2:file:${smallcrm.data-dir:./data}/smallcrm;DB_CLOSE_DELAY=-1
# Flyway owns the schema; Hibernate only checks that it still matches the entities and never
# alters anything itself.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Installations created before Flyway was introduced already carry the V1 schema, built by
# Hibernate. Baselining adopts them at version 1 instead of trying to create the tables again.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=Schema created by Hibernate before Flyway was introduced
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
# The DTO mappers dereference the owner, contact and deal of every row they map. Without
# batching that is one query per association per row; with it, one query per batch.
quarkus.hibernate-orm.unsupported-properties."hibernate.default_batch_fetch_size"=64

# --- Security: the application's own session mechanism --------------------------
# The built-in form mechanism is deliberately not used. Its cookie is self-contained —
# AES-GCM over "<expiry>:<username>" under a configured key — which means sessions cannot
# be ended server side, a password change does not invalidate the ones already issued, and
# anybody who learns the key can mint a cookie for any account without ever calling the
# login endpoint. SessionAuthenticationMechanism issues a random token instead and keeps
# the session in the database, so all three fall away and there is no shared secret to
# leak. That is also why no session encryption key is configured anywhere: nothing uses one.
smallcrm.session.idle-timeout=PT8H
# Absolute cap regardless of activity, so a stolen token cannot be kept alive by polling.
smallcrm.session.absolute-timeout=PT12H
# Only safe once HTTPS is actually in front: a browser silently drops a Secure cookie over
# plain HTTP, which would lock everyone out with no explanation.
smallcrm.session.cookie-secure=${SMALLCRM_HTTPS:false}
smallcrm.login.lockout-enabled=true

quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/logout,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# --- Security response headers --------------------------------------------------
# The Angular build emits no inline scripts, so 'self' suffices for script-src. Styles
# need 'unsafe-inline' because Angular writes component styles into <style> elements.
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'

# --- First start bootstrap ------------------------------------------------------
# The very first start creates this administrator. Leaving the password unset is the
# recommended way: a random one is generated and printed once to the operator's own
# console, so a published default cannot be used to claim the installation.
smallcrm.bootstrap.admin.username=${SMALLCRM_BOOTSTRAP_ADMIN_USERNAME:admin}
smallcrm.bootstrap.admin.password=${SMALLCRM_BOOTSTRAP_ADMIN_PASSWORD:}

# --- Angular frontend (served by Quinoa) ----------------------------------------
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/small-crm/browser
quarkus.quinoa.package-manager=pnpm
# Lifecycle scripts stay off during dependency installation; nothing in this frontend needs
# them, and it removes a supply chain attack surface from the build.
quarkus.quinoa.package-manager-command.install=install --ignore-scripts
quarkus.quinoa.package-manager-command.ci=install --frozen-lockfile --ignore-scripts
# "build:ci" verifies Prettier formatting before it produces the bundle.
quarkus.quinoa.package-manager-command.build=run build:ci
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.dev-server.managed=true
quarkus.quinoa.dev-server.index-page=index.html

# --- Backups --------------------------------------------------------------------
# A folder beside the database holding one XML file per change, plus whatever an
# administrator creates by hand. How long they are kept is set in the interface and
# stored in the database; everything here is an operator setting.
smallcrm.backup-dir=${SMALLCRM_BACKUP_DIR:./backup}
smallcrm.backup.auto-enabled=true
# Changes arriving within this many seconds of each other end up in one file, so a burst
# of edits does not fill the folder with near identical copies.
smallcrm.backup.coalesce-seconds=30
# A full database snapshot taken alongside the XML export. Unlike the XML it contains user
# accounts and settings, so it can rebuild an installation completely after a disk loss.
smallcrm.backup.snapshot-enabled=true

# Uploaded backups are read into memory, so the limit has to clear the largest file the
# service itself accepts.
quarkus.http.limits.max-body-size=64M

# --- Localisation ---------------------------------------------------------------
# Bean validation messages follow the browser's Accept-Language header, so a user who
# switched the UI to German also gets German field errors. English is the fallback and
# must not depend on the locale of the machine the server happens to run on.
quarkus.default-locale=en
quarkus.locales=en,de
# The zone a due date is judged in. Empty means the machine's own zone, which is right on the
# owner's own computer and wrong on a rented server in another country: a UTC host would call a
# task due today "due tomorrow" for the first hour of every local day. Example: Europe/Vienna.
smallcrm.time-zone=${SMALLCRM_TIME_ZONE:}

# --- Misc -----------------------------------------------------------------------
# The REST layer owns /api and nothing else. Everything outside it belongs to the Angular
# router, and Quinoa's single-page fallback only sees a request if REST has not already
# answered it. Without this root path, REST matches every URL, fails to find a resource for
# /contacts, and the application's own catch-all exception mapper turns that into a bare 404 —
# so a bookmarked or reloaded page comes back empty instead of opening the application.
quarkus.rest.path=/api
quarkus.http.enable-compression=true
quarkus.smallrye-openapi.info-title=Small CRM API
quarkus.smallrye-openapi.info-version=0.1.0

# --- Production -----------------------------------------------------------------
# Behind a TLS terminating reverse proxy set SMALLCRM_BEHIND_PROXY=true, otherwise Quarkus
# ignores X-Forwarded-Proto, isSSL() stays false and the session cookie never gets its
# Secure flag even though the browser is on HTTPS. The proxy must strip client supplied
# X-Forwarded-* headers.
%prod.quarkus.http.proxy.proxy-address-forwarding=${SMALLCRM_BEHIND_PROXY:false}
%prod.quarkus.http.proxy.allow-x-forwarded=${SMALLCRM_BEHIND_PROXY:false}
%prod.quarkus.http.proxy.enable-forwarded-host=${SMALLCRM_BEHIND_PROXY:false}
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
# The API description names every endpoint including the admin only trees; no reason to
# hand that to an unauthenticated client.
%prod.quarkus.smallrye-openapi.enable=false
# Logs on a terminal disappear with the terminal; an incident weeks later needs a file.
%prod.quarkus.log.file.enable=true
%prod.quarkus.log.file.path=${SMALLCRM_LOG_FILE:./logs/small-crm.log}
%prod.quarkus.log.file.rotation.max-file-size=10M
%prod.quarkus.log.file.rotation.max-backup-index=10
%prod.quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
%prod.quarkus.http.access-log.enabled=true
%prod.quarkus.http.access-log.pattern=%h %u "%r" %s %b %D
# Give in flight requests, above all a restore, a chance to finish on SIGTERM.
%prod.quarkus.shutdown.timeout=10S

# --- Development tool: a sequence diagram per call chain ------------------------
# cdi-flow records every public method call of this application's beans and writes the chain out
# as a Mermaid sequence diagram. Off by default, and off in a way that costs nothing: the value
# is read while the application is built, and with it false no bean is instrumented at all.
# A recording build is `mvn package -Dcdi-flow.enabled=true`; the run then needs
# CDI_FLOW_ENABLED=true as well, plus CDI_FLOW_OUTPUT_DIRECTORY to sort the files somewhere.
cdi-flow.enabled=false
cdi-flow.output-directory=${SMALLCRM_FLOW_DIR:./docs/flows}

# --- Development ----------------------------------------------------------------
%dev.quarkus.log.category."org.os890.smallcrm".level=DEBUG
# Development only: lets a second tool attach to the same file. Never in production.
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:${smallcrm.data-dir:./data}/smallcrm;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
# Development only, so `mvn quarkus:dev` on a fresh checkout has a known login. Production has
# no default at all: it generates one and prints it once. This value is long enough to satisfy
# the password policy, so the forced change at first sign-in behaves as it does in production.
%dev.smallcrm.bootstrap.admin.password=${SMALLCRM_BOOTSTRAP_ADMIN_PASSWORD:dev-only-password}

# --- Tests: isolated in memory database, no Angular build -----------------------
# In memory only here, so the suite starts from nothing every time and leaves nothing behind.
# Everything that ships — production, dev mode and the packaged distributions — runs on a file.
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:smallcrm-test;DB_CLOSE_DELAY=-1
# The tests run the real migrations against an empty database, so a broken or outdated script
# fails the build rather than surfacing on someone's installation.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.quinoa.enabled=false
%test.smallcrm.bootstrap.admin.username=admin
%test.smallcrm.bootstrap.admin.password=changeit-for-tests
# Append to the execution data the Maven agent already collects for the plain unit tests,
# and leave report generation and threshold checking to the JaCoCo Maven plugin.
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
# Tests drive the backup writer explicitly; a background timer would make them flaky.
%test.smallcrm.backup.auto-enabled=false
%test.smallcrm.backup.coalesce-seconds=1
%test.smallcrm.backup.snapshot-enabled=false
